{% extends "base.html" %} {% block title %}新建项目 — 主图工厂{% endblock %} {%
block content %}
<div class="breadcrumb">
  <a href="{{ url_for('index') }}">项目列表</a>
  <span class="sep">/</span>
  <span>新建项目</span>
</div>

<h1>新建项目</h1>

<div class="form-container">
  <div class="form-card">
    <form method="post" action="{{ url_for('project_create') }}">
      <label for="name">项目名称 *</label>
      <input
        type="text"
        id="name"
        name="name"
        required
        placeholder="例：蓝牙耳机主图"
      />

      <label for="asin">ASIN</label>
      <input
        type="text"
        id="asin"
        name="asin"
        maxlength="20"
        placeholder="B0XXXXXXXXX"
      />

      <label for="category">品类</label>
      <input
        type="text"
        id="category"
        name="category"
        placeholder="例：Electronics > Headphones"
      />

      <label for="notes">备注</label>
      <textarea
        id="notes"
        name="notes"
        rows="4"
        placeholder="项目备注信息…"
      ></textarea>

      <button type="submit">创建项目</button>
    </form>
  </div>
</div>
{% endblock %}
